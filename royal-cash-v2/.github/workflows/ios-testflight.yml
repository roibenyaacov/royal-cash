# Builds the iOS app on a hosted macOS runner and uploads it to TestFlight.
#
# This exists because the repository is developed on Windows, and an iOS
# archive can only be produced on macOS. Rather than making a Mac a
# prerequisite for shipping, the one step that needs one runs here.
#
# ============================================
# BEFORE THE FIRST RUN
# ============================================
# Create these repository secrets (Settings -> Secrets and variables ->
# Actions). Every one of them comes from the Apple Developer account;
# none of them can be generated from this repository.
#
#   APPLE_TEAM_ID                 Ten characters, from developer.apple.com
#                                 -> Membership.
#   ASC_KEY_ID                    App Store Connect API key id.
#   ASC_ISSUER_ID                 App Store Connect API issuer id.
#   ASC_KEY_P8                    The .p8 private key, contents pasted
#                                 whole, including the BEGIN/END lines.
#   IOS_CERT_P12_BASE64           Apple Distribution certificate exported
#                                 as .p12, then base64 encoded.
#   IOS_CERT_PASSWORD             The password set when exporting the .p12.
#   IOS_PROVISIONING_PROFILE_BASE64
#                                 App Store provisioning profile for
#                                 app.royalcash, base64 encoded.
#
# On Windows, base64-encode a file with:
#   certutil -encode cert.p12 cert.b64   (then strip the header/footer lines)
#
# ============================================
# NOT YET RUN
# ============================================
# This workflow has never executed — it was written on a machine with no
# macOS available, so treat the first run as part of the setup rather than
# as a build that should simply pass.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (must be higher than the last upload)'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The shell loads the deployed site, so there is no web build to
      # produce here — only the offline fallback in native/www, which is
      # already in the repository.
      - name: Add and sync the iOS platform
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Generate icons and launch screens
        run: npx @capacitor/assets generate --ios

      - name: Install the signing certificate
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          # A throwaway keychain, so the runner's default one is left alone
          # and the key material dies with the job.
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          echo "$CERT_B64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm /tmp/cert.p12

      - name: Install the provisioning profile
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ inputs.build_number }}" \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: Export the .ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export"/*.ipa \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the archive for debugging a failed upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: ${{ runner.temp }}/export
          if-no-files-found: ignore
          retention-days: 7

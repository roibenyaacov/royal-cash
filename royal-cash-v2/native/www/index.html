<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Royal Cash</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%;
        background: #0f0f0f; color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      main {
        height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 14px; padding: 24px; text-align: center;
      }
      h1 { margin: 0; font-size: 20px; font-weight: 700; }
      p { margin: 0; font-size: 14px; line-height: 1.6; color: #a0a0a0; max-width: 20rem; }
      .en { font-size: 13px; color: #6f6f6f; direction: ltr; }
      .mark {
        width: 56px; height: 56px; border-radius: 50%;
        border: 1px solid rgba(201, 168, 76, 0.35);
        display: flex; align-items: center; justify-content: center;
        color: #c9a84c; font-size: 24px; font-weight: 700;
      }
    </style>
  </head>
  <body>
    <!--
      Shown when the device has no connection. The app itself is served
      over the network, so without this the web view would present a blank
      screen — which App Store review treats as a crash.
    -->
    <main>
      <div class="mark">♠</div>
      <h1>אין חיבור לאינטרנט</h1>
      <p>Royal Cash צריכה חיבור כדי לסנכרן את השולחן עם שאר החבורה. התחבר לרשת ונסה שוב.</p>
      <p class="en">Royal Cash needs a connection to keep the table in sync with your group. Reconnect and try again.</p>
    </main>
  </body>
</html>
